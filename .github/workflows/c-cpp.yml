name: C/C++ CI

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    # Usa o container oficial do ps2dev que já tem o SDK completo instalado
    container: ps2dev/ps2dev:latest

    steps:
    - uses: actions/checkout@v4

    - name: Build with make
      run: |
        cd source/ps2
        make clean || true
        make

    - name: Upload ELF Artifact
      uses: actions/upload-artifact@v4
      with:
        name: TempGBA-PS2-AutoBoot
        path: source/ps2/*.elf
        
